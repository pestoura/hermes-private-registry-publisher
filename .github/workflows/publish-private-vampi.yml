name: Publish private VAmPI to GHCR

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the immutable private VAmPI pilot image
        required: true
        type: boolean
        default: false

concurrency:
  group: ghcr-private-vampi-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hermes-private-vampi
  CANONICAL_SOURCE_REPOSITORY: https://github.com/pestoura/hermes-security-labs
  CANONICAL_SOURCE_COMMIT: b675c4c4f0f6a0c9ec22953a9cda8b5140b32db7
  UPSTREAM_REPOSITORY: https://github.com/erev0s/VAmPI
  UPSTREAM_COMMIT: f16052dce83f05847133ec98f01c5193a41de7d8
  UPSTREAM_SHORT: f16052d
  DOCKERFILE_SHA256: 555b6d28d7e3c4bd39c75d6a9d102aca9a0c08a8011ae7f780c6b58b167e827a

jobs:
  publish:
    name: Build and publish immutable private VAmPI image
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Verify immutable upstream Dockerfile
        shell: bash
        run: |
          set -euo pipefail

          url="https://raw.githubusercontent.com/erev0s/VAmPI/${UPSTREAM_COMMIT}/Dockerfile"
          curl --fail --silent --show-error --location "$url" --output Dockerfile.upstream
          printf '%s  %s\n' "$DOCKERFILE_SHA256" Dockerfile.upstream | sha256sum --check --strict

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
        with:
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable OCI metadata
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=upstream-${{ env.UPSTREAM_SHORT }}
            type=sha,prefix=publisher-,format=long
          labels: |
            org.opencontainers.image.title=Hermes Private VAmPI
            org.opencontainers.image.description=Immutable private VAmPI laboratory image for Hermes Security Labs
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docs/vampi-private-pilot.md
            org.opencontainers.image.version=upstream-${{ env.UPSTREAM_SHORT }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.hermes.canonical-source=${{ env.CANONICAL_SOURCE_REPOSITORY }}
            io.hermes.canonical-source.revision=${{ env.CANONICAL_SOURCE_COMMIT }}
            io.hermes.build.recipe=vampi-upstream-${{ env.UPSTREAM_SHORT }}
            io.hermes.build.dockerfile-sha256=${{ env.DOCKERFILE_SHA256 }}
            io.hermes.upstream.repository=${{ env.UPSTREAM_REPOSITORY }}
            io.hermes.upstream.revision=${{ env.UPSTREAM_COMMIT }}

      - name: Build and push private VAmPI
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: https://github.com/erev0s/VAmPI.git#f16052dce83f05847133ec98f01c5193a41de7d8
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=private-vampi-f16052d
          cache-to: type=gha,mode=max,scope=private-vampi-f16052d

      - name: Verify published digest
        shell: bash
        run: |
          set -euo pipefail

          digest='${{ steps.push.outputs.digest }}'
          test -n "$digest"
          [[ "$digest" == sha256:* ]]

          image_ref="${REGISTRY}/${IMAGE_NAME}@${digest}"
          docker buildx imagetools inspect "$image_ref"

          {
            echo '### Private VAmPI GHCR publication'
            echo
            echo "- Package: \`${REGISTRY}/${IMAGE_NAME}\`"
            echo "- Publisher commit: \`${GITHUB_SHA}\`"
            echo "- Canonical source commit: \`${CANONICAL_SOURCE_COMMIT}\`"
            echo "- Upstream commit: \`${UPSTREAM_COMMIT}\`"
            echo "- Upstream Dockerfile SHA-256: \`${DOCKERFILE_SHA256}\`"
            echo "- Immutable reference: \`${image_ref}\`"
            echo "- Platform: \`linux/amd64\`"
            echo '- BuildKit provenance: `mode=max`'
            echo '- SBOM: enabled'
            echo '- Deployment: not performed'
          } >> "$GITHUB_STEP_SUMMARY"
